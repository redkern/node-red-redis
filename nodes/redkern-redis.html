<script type="text/javascript">
(function () {

    function intRange(min, max) {
        return function (value) {
            var text = String(value === undefined ? "" : value).trim();
            if (!/^\d+$/.test(text)) { return false; }
            var number = Number(text);
            return number >= min && number <= max;
        };
    }
    function floatRange(min, max) {
        return function (value) {
            var number = Number(value);
            return String(value).trim() !== "" && isFinite(number) && number >= min && number <= max;
        };
    }
    var FIELDS = {
        reliability: ["maxPending", "maxDeliveries", "reclaimIdleMs", "reclaimIntervalMs", "reclaimCount", "drainTimeoutMs"],
        advanced: ["count", "blockMs", "readIntervalMs", "rateLimitPerSecond", "batchWindowMs", "batchIntervalMs", "capacityCheckIntervalMs", "capacityPollMs", "initialBackoffMs", "maxBackoffMs", "backoffMultiplier"]
    };

    RED.nodes.registerType("redkern-redis-stream-in", {
        category: "redkern redis",
        color: "#F4B3A1",
        icon: "redkern-redis-stream-in.svg",
        defaults: {
            name: { value: "" },
            server: { value: "", type: "redkern-redis-config", required: true },
            streamKey: { value: "", required: true },
            group: { value: "", required: true },
            consumer: { value: "" },
            ackMode: { value: "manual" },
            startId: { value: "$", required: true },
            startPaused: { value: false },
            maxPending: { value: 1000, validate: intRange(1, 1000000) },
            backpressureScope: { value: "consumer" },
            maxDeliveries: { value: 5, validate: intRange(0, 1000) },
            deadLetterStream: { value: "" },
            autoClaim: { value: true },
            reclaimIdleMs: { value: 60000, validate: intRange(1000, 86400000) },
            reclaimIntervalMs: { value: 30000, validate: intRange(1000, 86400000) },
            reclaimCount: { value: 100, validate: intRange(1, 100000) },
            drainTimeoutMs: { value: 30000, validate: intRange(0, 1800000) },
            count: { value: 100, validate: intRange(1, 100000) },
            blockMs: { value: 5000, validate: intRange(1, 600000) },
            readIntervalMs: { value: 0, validate: intRange(0, 3600000) },
            rateLimitPerSecond: { value: 0, validate: floatRange(0, 1000000) },
            batchWindowMs: { value: 0, validate: intRange(0, 3600000) },
            batchIntervalMs: { value: 0, validate: intRange(0, 3600000) },
            capacityCheckIntervalMs: { value: 250, validate: intRange(50, 600000) },
            capacityPollMs: { value: 500, validate: intRange(50, 600000) },
            initialBackoffMs: { value: 500, validate: intRange(50, 600000) },
            maxBackoffMs: { value: 30000, validate: intRange(50, 3600000) },
            backoffMultiplier: { value: 2, validate: floatRange(1, 10) },
            legacyMsgFields: { value: false }
        },
        inputs: 0,
        outputs: 1,
        paletteLabel: function () { return this._("streamIn.paletteLabel"); },
        label: function () {
            if (this.name) { return this.name; }
            if (this.streamKey && this.group) { return this.streamKey + ":" + this.group; }
            return this._("streamIn.default");
        },
        labelStyle: function () { return this.name ? "node_label" : "node_label_italic"; },

        oneditprepare: function () {
            var node = this;

                id: "redkern-redis-stream-in-tabs",

                    $("#" + tab.id).show();

            });
            tabs.addTab({ id: "redkern-redis-stream-in-tab-general", label: node._("common.tabs.general") });
            tabs.addTab({ id: "redkern-redis-stream-in-tab-reliability", label: node._("common.tabs.reliability") });
            tabs.addTab({ id: "redkern-redis-stream-in-tab-advanced", label: node._("common.tabs.advanced") });

})();
