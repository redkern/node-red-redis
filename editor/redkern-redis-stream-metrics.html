<script type="text/javascript">
(function () {
    "use strict";
    RED.nodes.registerType("redkern-redis-stream-metrics", {
        category: "redkern redis",
        color: "#F4B3A1",
        icon: "redkern-redis-stream-metrics.svg",
        defaults: {
            name: { value: "" },
            server: { value: "", type: "redkern-redis-config", required: true },
            streamKey: { value: "" },
            group: { value: "" },
            deadLetterStream: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: function () { return this._("streamMetrics.paletteLabel"); },
        label: function () { return this.name || this.streamKey || this._("streamMetrics.default"); },
        labelStyle: function () { return this.name ? "node_label" : "node_label_italic"; },
        inputLabels: function () { return this._("common.ports.input"); },
        outputLabels: function () { return this._("streamMetrics.ports.sample"); }
    });
})();
</script>

<script type="text/html" data-template-name="redkern-redis-stream-metrics">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> <span data-i18n="common.label.server"></span></label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-streamKey"><i class="fa fa-bars"></i> <span data-i18n="common.label.stream"></span></label>
        <input type="text" id="node-input-streamKey" data-i18n="[placeholder]common.placeholder.fromMsg">
    </div>
    <div class="form-row">
        <label for="node-input-group"><i class="fa fa-users"></i> <span data-i18n="common.label.group"></span></label>
        <input type="text" id="node-input-group" data-i18n="[placeholder]common.placeholder.fromMsg">
    </div>
    <div class="form-row">
        <label for="node-input-deadLetterStream"><i class="fa fa-inbox"></i> <span data-i18n="streamMetrics.label.deadLetterStream"></span></label>
        <input type="text" id="node-input-deadLetterStream" data-i18n="[placeholder]common.placeholder.optional">
    </div>
    <div class="form-tips"><span data-i18n="streamMetrics.tip.metrics"></span></div>
</script>
