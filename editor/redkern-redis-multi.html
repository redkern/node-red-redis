<script type="text/javascript">
(function () {
    "use strict";
    function intRange(min, max) {
        return function (value) {
            var text = String(value === undefined ? "" : value).trim();
            if (!/^\d+$/.test(text)) { return false; }
            var number = Number(text);
            return number >= min && number <= max;
        };
    }
    function commandCount(value) {
        if (!value) { return 0; }
        try {
            var list = JSON.parse(value);
            return Array.isArray(list) ? list.length : 0;
        } catch (e) {
            return 0;
        }
    }

    RED.nodes.registerType("redkern-redis-multi", {
        category: "redkern redis",
        color: "#F4B3A1",
        icon: "redkern-redis-multi.svg",
        defaults: {
            name: { value: "" },
            server: { value: "", type: "redkern-redis-config", required: true },
            commands: {
                value: "",
                validate: function (value) {
                    if (!value) { return true; }
                    try {
                        var list = JSON.parse(value);
                        return Array.isArray(list) && list.length > 0 && list.every(function (entry) { return Array.isArray(entry) && entry.length > 0; });
                    } catch (e) {
                        return false;
                    }
                }
            },
            disableDenylist: { value: false },
            errorOutput: { value: false },
            concurrency: { value: 64, validate: intRange(1, 10000) },
            maxQueue: { value: 10000, validate: intRange(0, 1000000) },
            outputs: { value: 1 }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: function () { return this._("multi.paletteLabel"); },
        label: function () {
            if (this.name) { return this.name; }
            var count = commandCount(this.commands);
            return count ? this._("multi.default") + " " + count : this._("multi.default");
        },
        labelStyle: function () { return this.name ? "node_label" : "node_label_italic"; },
        inputLabels: function () { return this._("common.ports.input"); },
        outputLabels: function (index) { return index === 0 ? this._("multi.ports.results") : this._("common.ports.error"); },
        oneditprepare: function () {
            $("#node-input-errorOutput").on("change", function () {
                $("#node-input-outputs").val($(this).prop("checked") ? 2 : 1);
            });
        },
        oneditsave: function () {
            $("#node-input-outputs").val($("#node-input-errorOutput").prop("checked") ? 2 : 1);
        }
    });
})();
</script>

<script type="text/html" data-template-name="redkern-redis-multi">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> <span data-i18n="common.label.server"></span></label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-commands"><i class="fa fa-list"></i> <span data-i18n="multi.label.commands"></span></label>
        <input type="text" id="node-input-commands" data-i18n="[placeholder]multi.placeholder.commands">
    </div>
    <div class="form-tips" style="margin-bottom: 12px;"><span data-i18n="multi.tip.commands"></span></div>
    <div class="form-row">
        <input type="checkbox" id="node-input-disableDenylist" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-disableDenylist" style="width: auto;"><i class="fa fa-exclamation-triangle"></i> <span data-i18n="multi.label.disableDenylist"></span></label>
    </div>
    <div class="form-row">
        <input type="checkbox" id="node-input-errorOutput" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-errorOutput" style="width: auto;"><span data-i18n="common.label.errorOutput"></span></label>
        <div class="form-tips"><span data-i18n="common.tip.errorOutput"></span></div>
    </div>
    <div class="form-row">
        <label for="node-input-concurrency"><span data-i18n="common.label.concurrency"></span></label>
        <input type="text" id="node-input-concurrency" style="width: 100px;">
    </div>
    <div class="form-tips" style="margin-bottom: 12px;"><span data-i18n="common.tip.concurrency"></span></div>
    <div class="form-row">
        <label for="node-input-maxQueue"><span data-i18n="common.label.maxQueue"></span></label>
        <input type="text" id="node-input-maxQueue" style="width: 100px;">
    </div>
</script>
