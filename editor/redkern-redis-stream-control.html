<script type="text/javascript">
(function () {
    "use strict";
    RED.nodes.registerType("redkern-redis-stream-control", {
        category: "redkern redis",
        color: "#F4B3A1",
        icon: "redkern-redis-stream-control.svg",
        defaults: {
            name: { value: "" },
            action: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: function () { return this._("streamControl.paletteLabel"); },
        label: function () { return this.name || this.action || this._("streamControl.default"); },
        labelStyle: function () { return this.name ? "node_label" : "node_label_italic"; },
        inputLabels: function () { return this._("common.ports.input"); },
        outputLabels: function () { return this._("streamControl.ports.result"); }
    });
})();
</script>

<script type="text/html" data-template-name="redkern-redis-stream-control">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-sliders"></i> <span data-i18n="streamControl.label.action"></span></label>
        <select id="node-input-action" style="width: 70%;">
            <option value="" data-i18n="streamControl.action.msg"></option>
            <option value="pause" data-i18n="streamControl.action.pause"></option>
            <option value="resume" data-i18n="streamControl.action.resume"></option>
            <option value="drain" data-i18n="streamControl.action.drain"></option>
            <option value="status" data-i18n="streamControl.action.status"></option>
        </select>
    </div>
    <div class="form-tips"><span data-i18n="streamControl.tip.control"></span></div>
</script>
